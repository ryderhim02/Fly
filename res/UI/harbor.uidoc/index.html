<div class="screen">
  <div class="brand"><div class="eyebrow">THE QUIET COLLECTION</div><div class="title">SUNLIT SHORES</div><div class="small">{{caught}}</div></div>
  <div class="wallet"><img src="coin_5faf13.png"><div class="balance">{{coins}}</div></div>
  <div class="actions"><div class="rod"><span data-text-reserve="Celestial Rod">{{rod}}</span></div><button id="upgrade" data-if="can_upgrade" data-on-click="event:upgrade"><span data-text-reserve="Upgrade  45000">{{upgrade}}</span></button><div class="locked" data-if="!can_upgrade"><span data-text-reserve="Upgrade  45000">{{upgrade}}</span></div><button id="sell" class="sell" data-if="can_sell" data-on-click="event:sell"><span data-text-reserve="Sell catch  +8888888">{{sell}}</span></button><div class="empty" data-if="!can_sell"><span data-text-reserve="Sell catch  +8888888">{{sell}}</span></div><button id="admin" class="admin" data-if="admin" data-on-click="event:admin">Admin fish</button></div>
  <div class="catch" data-if="reveal"><div class="eyebrow" data-style-color="rarity_color"><span data-text-reserve="ADMIN EXCLUSIVE">{{rarity}}</span></div><img class="catch-art" src="{{fish_icon}}"><div class="fish-name">{{fish_name}}</div><div class="value"><span data-text-reserve="Admin exclusive · Not for sale">{{value}}</span></div></div>
  <div class="admin-panel" data-if="admin_open"><div class="panel-title">ADMIN COLLECTION</div><div class="exclusive">Exclusive fish · kept out of normal catches</div><div class="admin-row"><button class="fish-card" data-key="sanic" data-on-click="event:grant"><img src="generated_6ad3ee64_03a5f4.png"><div>SANIC</div></button><button class="fish-card" data-key="egg" data-on-click="event:grant"><img src="generated_6ad3ee64_6b31e3.png"><div>DR EGG MAN</div></button></div><button id="close" data-on-click="event:close">Close</button></div>
</div>
